<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description" content="Contact White Water Rafting with questions about trips, reservations, or website suggestions.">
    <meta name="author" content="Orie Onugu">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact-layout">
            <iframe src="https://www.google.com/maps?q=Kolob+Canyon+Utah&output=embed" width="400" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map of White Water Rafting Company location"></iframe>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>

                <label><input type="checkbox" name="newsletter"> Please subscribe me to the monthly newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/happy-client.jpg" alt="Happy rafting guide smiling">
                <figcaption>Sarah Johnson - Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/hero.jpg" alt="Rafting instructor on the river">
                <figcaption>Mike Torres - Trip Manager</figcaption>
            </figure>
            <figure>
                <img src="images/happy-client.jpg" alt="Customer service representative smiling">
                <figcaption>Emily Chen - Customer Support</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 | White Water Rafting | Orie Onugu</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
